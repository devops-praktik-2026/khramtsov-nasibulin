- name: Проверить наличие открытых ключей
  ansible.builtin.assert:
    that: deploy_public_keys | length > 0
    fail_msg: Передайте открытые ключи в deploy_public_keys (см. vars.example.yml).

- name: Установить системные зависимости
  ansible.builtin.apt:
    name: [python3-venv, python3-pip, supervisor, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Создать каталог приложения
  ansible.builtin.file:
    path: /opt/orders
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'

- name: Добавить открытые ключи участников
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ deploy_public_keys }}"
