- name: Выбрать установку из GitHub Release или из локального wheel
  ansible.builtin.include_tasks: "{{ 'release.yml' if version is defined else 'local.yml' }}"

- name: Создать настройки приложения
  ansible.builtin.template:
    src: orders.env.j2
    dest: /opt/orders/.env
    owner: deploy
    group: deploy
    mode: '0600'
  no_log: true
  register: orders_environment
  notify: Перезапустить orders

- name: Обновить схему до переключения кода
  ansible.builtin.script:
    cmd: migrate_release.py
    executable: "{{ orders_app_venv }}/bin/python"
    chdir: /opt/orders
  become_user: deploy
  register: orders_schema
  changed_when: "'upgraded' in orders_schema.stdout_lines"
  when:
    - orders_has_migrations
    - orders_database_url.startswith('sqlite') or inventory_hostname == ansible_play_hosts_all[0]

- name: Атомарно переключить ссылку на проверенную версию
  ansible.builtin.file:
    src: "{{ orders_release_dir }}"
    dest: /opt/orders/current
    state: link
    follow: false
  register: orders_current
  notify: Перезапустить orders
  when: version is defined

- name: Настроить службу Supervisor
  ansible.builtin.template:
    src: orders.conf.j2
    dest: /etc/supervisor/conf.d/orders.conf
    owner: root
    group: root
    mode: '0644'
  register: orders_supervisor_file
  notify:
    - Применить описание orders
    - Перезапустить orders

- name: Обнаружить описание orders, которое Supervisor ещё не применил
  ansible.builtin.command:
    argv: [/usr/bin/supervisorctl, reread]
  register: orders_pending_config
  changed_when: "'orders: changed' in orders_pending_config.stdout_lines or 'orders: available' in orders_pending_config.stdout_lines"
  when: not orders_supervisor_file.changed
  notify: Применить описание orders

- name: Проверить, применил ли работающий процесс последнюю установку
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/health
    timeout: 2
  register: orders_running
  failed_when: false
  changed_when: >-
    (orders_running.status | default(-1)) != 200 or (orders_running.json.status | default('')) != 'ok'
    or (orders_running.json.service | default('')) != 'orders'
    or (orders_running.json.version | default('')) != orders_app_version
  when: orders_has_migrations and not (orders_current.changed or orders_environment.changed or orders_supervisor_file.changed)
  notify: Перезапустить orders

- name: Применить изменения до проверки приложения
  ansible.builtin.meta: flush_handlers

- name: Обеспечить запуск orders
  community.general.supervisorctl:
    name: orders
    state: started

- name: Проверить здоровье приложения внутри сервера
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/health
    status_code: 200
    return_content: true
    timeout: 3
  register: orders_health
  until: >-
    orders_health.status == 200 and
    (orders_health.json.status | default('')) == 'ok' and
    (orders_health.json.service | default('')) == 'orders' and
    (not orders_has_migrations or (orders_health.json.version | default('')) == orders_app_version)
  retries: 10
  delay: 2
