- name: Проверить имя метки, формат SHA256 и репозитория
  ansible.builtin.assert:
    that:
      - version is string and version is match('^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}\Z')
      - release_checksum is not defined or (release_checksum is string and release_checksum is match('^sha256:[0-9a-fA-F]{64}\Z'))
      - release_repository is not defined or (release_repository is string and release_repository is match('^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+\Z'))
    fail_msg: Ожидаются version=vX.Y.Z, release_checksum=sha256:<64 шестнадцатеричных знака> и release_repository=owner/repo.

- name: Найти отметку проверенного релиза
  ansible.builtin.stat:
    path: "{{ orders_release_dir }}/.sha256"
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: orders_verified
  when: release_checksum is defined

- name: Получить wheel для новой версии
  when: release_checksum is defined and not orders_verified.stat.exists
  block:
    - name: Потребовать источник и SHA256 для первой установки
      ansible.builtin.assert:
        that:
          - orders_release_base_url is match('^https?://[^/\s]+(/[^\s]*)?\Z')
        fail_msg: Для новой версии укажите release_repository и release_checksum из GitHub Release.

    - name: Подготовить каталог загрузки по SHA256
      ansible.builtin.file:
        path: "/opt/orders/artifacts/{{ release_checksum[7:] | lower }}"
        state: directory
        mode: '0755'

    - name: Скачать wheel и проверить SHA256 до установки
      ansible.builtin.get_url:
        url: "{{ orders_release_base_url | regex_replace('/+$', '') }}/{{ version }}/{{ orders_release_wheel }}"
        dest: "/opt/orders/artifacts/{{ release_checksum[7:] | lower }}/{{ orders_release_wheel }}"
        checksum: "{{ release_checksum | lower }}"
        mode: '0644'
        timeout: 30

- name: Подготовить окружение релиза и сверить фактическую версию пакета
  ansible.builtin.script:
    cmd: "prepare_release.py {{ orders_release_dir | quote }} {{ release_checksum | default('') | lower | quote }}"
    executable: /usr/bin/python3
  become_user: deploy
  environment:
    PIP_DEFAULT_TIMEOUT: '60'
    PIP_RETRIES: '5'
  register: orders_release
  changed_when: "'installed' in orders_release.stdout_lines"
