orders_version: >-
  {{ (lookup('ansible.builtin.file', playbook_dir + '/../../services/orders/pyproject.toml')
      | regex_findall('(?m)^version = "([^"]+)"$')) | first }}
orders_wheel: "{{ playbook_dir }}/../../dist/orders-{{ orders_version }}-py3-none-any.whl"
orders_release_base_url: "{{ 'https://github.com/' ~ release_repository ~ '/releases/download' if release_repository is defined else '' }}"
orders_release_version: "{{ version[1:] }}"
orders_release_dir: "/opt/orders/releases/{{ orders_release_version }}"
orders_release_wheel: "orders-{{ orders_release_version }}-py3-none-any.whl"
orders_app_venv: "{{ orders_release_dir ~ '/venv' if version is defined else '/opt/orders/venv' }}"
orders_app_version: "{{ orders_release_version if version is defined else orders_version }}"
orders_has_migrations: "{{ version is defined or (orders_local_migrator.stat.exists | default(false)) }}"
orders_accounts_url: http://host.docker.internal:8001
orders_accounts_timeout_seconds: 2.0
orders_database_url: sqlite:////opt/orders/orders.db
