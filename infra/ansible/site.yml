- name: Настроить серверы сервиса заказов
  hosts: app
  become: true
  pre_tasks:
    - name: Проверить режим запуска
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Для статической проверки используйте --syntax-check; установка требует обычного запуска.
  roles:
    - base
    - app
