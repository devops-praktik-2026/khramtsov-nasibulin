name: Выпуск orders

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Пакет orders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить, что коммит выпуска вошёл в основную ветку
        if: github.ref_type == 'tag'
        env:
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$MAIN_BRANCH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Собрать wheel и вычислить SHA256
        run: |
          python -m pip install build
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/build_release.py --outdir dist "${args[@]}"
      - name: Проверить тесты на собранном пакете
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python -m pip install -e './services/accounts[dev]' dist/*.whl
          python -m pytest
          cd "$RUNNER_TEMP"
          DATABASE_URL=sqlite:///release-check.db orders-migrate upgrade head
      - uses: actions/upload-artifact@v4
        with:
          name: orders-release
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Опубликовать GitHub Release
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orders-release
          path: dist
      - name: Опубликовать проверенный пакет и SHA256SUMS
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.whl SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "orders $GITHUB_REF_NAME" --generate-notes
